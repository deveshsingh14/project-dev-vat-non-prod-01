<!-- deployment trigger -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajeshwari — Bangles & Jewellery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
    rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7a1f3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rajeshwari">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="stylesheet" href="store.css">
</head>

<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar" id="topbar">
    <a class="logo" href="#" onclick="resetFeed(); return false;">
      <span class="logo-mark">R</span>
      <span class="logo-text">Rajeshwari<em>Bangles &amp; Jewellery</em></span>
    </a>

    <div class="search-wrap">
      <span class="s-ico">⌕</span>
      <input type="text" id="searchInput" placeholder="Search bangles, earrings, skincare…" autocomplete="off">
      <button class="s-clear" id="searchClear" onclick="clearSearch()">×</button>
    </div>

    <nav class="top-actions">
      <button class="icon-btn" onclick="openWishlist()" title="Saved">
        <span class="ib-ico">♥</span><span class="ib-label">Saved</span>
        <span class="count-dot" id="wishCount">0</span>
      </button>
      <button class="icon-btn" onclick="openCart()" title="Bag">
        <span class="ib-ico">🛍</span><span class="ib-label">Bag</span>
        <span class="count-dot" id="cartCount">0</span>
      </button>
      <button class="icon-btn" id="accountBtn" onclick="window.location.href='account.html'" style="display:none;"
        title="My account">
        <span class="ib-ico">☺</span><span class="ib-label">Account</span>
      </button>
      <button class="icon-btn login-cta" id="loginBtn" onclick="openAuth()">Log in</button>
      <button class="icon-btn" id="logoutBtn" onclick="logout()" style="display:none;">
        <span class="ib-ico">⎋</span><span class="ib-label">Log out</span>
      </button>
    </nav>
  </header>

  <!-- ============ CATEGORY STORIES ============ -->
  <section class="stories-wrap">
    <div class="stories" id="storiesRail"><!-- filled by JS --></div>
  </section>

  <!-- ============ FILTER / SORT BAR ============ -->
  <div class="feed-controls">
    <div class="chips" id="chipBar"><!-- filled by JS --></div>
    <select id="sortSelect" onchange="applyFilters()">
      <option value="new">Newest</option>
      <option value="priceAsc">Price: low → high</option>
      <option value="priceDesc">Price: high → low</option>
    </select>
  </div>

  <!-- ============ MASONRY FEED ============ -->
  <main class="feed-area">
    <div class="masonry" id="masonry"><!-- cards --></div>
    <div class="feed-end" id="feedEnd" style="display:none;">
      <span>✦</span> You've explored everything — check back for new arrivals
    </div>
  </main>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav class="bottom-nav">
    <button class="bn-item active" onclick="resetFeed()"><span>⌂</span>Home</button>
    <button class="bn-item" onclick="focusSearch()"><span>⌕</span>Search</button>
    <button class="bn-item" onclick="openWishlist()"><span>♥</span>Saved</button>
    <button class="bn-item" onclick="openCart()"><span>🛍</span>Bag</button>
  </nav>

  <!-- ============ PRODUCT SHEET ============ -->
  <div class="sheet-back" id="productSheet">
    <div class="sheet" id="sheetCard">
      <button class="sheet-close" onclick="closeSheet()">×</button>
      <div class="sheet-grid" id="sheetGrid"><!-- filled --></div>
    </div>
  </div>

  <!-- ============ CART DRAWER ============ -->
  <div class="drawer-back" id="cartBack" onclick="backdropClose(event,'cart')">
    <aside class="drawer" id="cartDrawer">
      <div class="drawer-head">
        <h2>Your bag</h2>
        <button class="x-btn" onclick="closeCart()">×</button>
      </div>
      <div class="drawer-body" id="cartItems"></div>
      <div class="drawer-foot" id="cartFoot">
        <div class="total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div>
        <button class="btn-solid" onclick="goToCheckout()">Checkout</button>
      </div>
    </aside>
  </div>

  <!-- ============ WISHLIST DRAWER ============ -->
  <div class="drawer-back" id="wishBack" onclick="backdropClose(event,'wish')">
    <aside class="drawer" id="wishDrawer">
      <div class="drawer-head">
        <h2>Saved</h2>
        <button class="x-btn" onclick="closeWishlist()">×</button>
      </div>
      <div class="drawer-body" id="wishlistItems"></div>
    </aside>
  </div>

  <!-- ============ AUTH MODAL ============ -->
  <div class="sheet-back" id="authModal">
    <div class="auth-card">
      <button class="sheet-close" onclick="closeAuth()">×</button>
      <div class="auth-logo">Rajeshwari</div>
      
      <!-- PHONE LOGIN SECTION (Default) -->
      <div id="phoneAuthSection">
        <h2 id="authTitle">Sign in / Sign up</h2>
        <p class="auth-sub" id="authSub">Enter your mobile number to get started.</p>
        
        <div id="step1">
          <input type="text" id="authPhone" placeholder="+91 9876543210" style="margin-bottom: 15px;">
          <button class="btn-solid" id="getOtpBtn" onclick="sendOtp()">Send OTP</button>
          <div id="recaptcha-container" style="margin-top: 10px;"></div>
        </div>

        <div id="step2" style="display:none;">
          <input type="text" id="authOtp" placeholder="6-digit OTP" style="margin-bottom: 15px;">
          <button class="btn-solid" id="verifyOtpBtn" onclick="verifyOtp()">Verify & Login</button>
        </div>
        
        <p class="auth-switch" style="margin-top: 20px;">
          <button onclick="toggleSuperadminAuth()" style="font-size: 11px; color: #888; text-decoration: underline; background: none; border: none; cursor: pointer;">Superadmin Login</button>
        </p>
      </div>

      <!-- SUPERADMIN EMAIL LOGIN SECTION -->
      <div id="emailAuthSection" style="display:none;">
        <h2>Superadmin Login</h2>
        <p class="auth-sub">Restricted access.</p>
        <input type="email" id="authEmail" placeholder="Email address" style="margin-bottom: 10px;">
        <input type="password" id="authPassword" placeholder="Password" style="margin-bottom: 15px;">
        <button class="btn-solid" id="authBtn" onclick="submitEmailAuth()">Log in</button>
        <p class="auth-switch" style="margin-top: 20px;">
          <button onclick="toggleSuperadminAuth()" style="font-size: 11px; color: #888; text-decoration: underline; background: none; border: none; cursor: pointer;">Back to Phone Login</button>
        </p>
      </div>

    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyC9YpgkodtXhzVbEFZ1-_hHjL9HFwk00Lc",
      authDomain: "ego-e-com.firebaseapp.com",
      projectId: "ego-e-com",
      storageBucket: "ego-e-com.firebasestorage.app",
      messagingSenderId: "65700052430",
      appId: "1:65700052430:web:3647f8ba11ebba63c03f9f",
      measurementId: "G-HHM62WFRDX"
    };
  
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    window.firebaseAuth = auth;
    window.RecaptchaVerifier = RecaptchaVerifier;
    window.signInWithPhoneNumber = signInWithPhoneNumber;
  </script>
  <script src="store.js"></script>
  <script src="pwa.js" defer></script>
</body>

</html>
