<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Rajeshwari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fff; color: #3d353c; text-align: center;
    font-family: "DM Sans", system-ui, sans-serif; padding: 24px;
  }
  .mark {
    width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 22px;
    background: radial-gradient(circle at 32% 26%, #a03355, #7a1f3d);
    color: #fff; font-family: "Cinzel", serif; font-weight: 700; font-size: 34px;
    display: grid; place-items: center;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px #c99a3f;
  }
  h1 { font-size: 21px; color: #211a20; margin: 0 0 8px; }
  p { color: #8f8691; font-size: 14px; max-width: 320px; margin: 0 auto 24px; line-height: 1.6; }
  button {
    border: none; border-radius: 999px; background: #7a1f3d; color: #fff;
    font-family: inherit; font-size: 14.5px; font-weight: 700;
    padding: 13px 28px; cursor: pointer;
  }
  button:hover { background: #5f172f; }
</style>
</head>
<body>
  <div>
    <div class="mark">R</div>
    <h1>You're offline</h1>
    <p>We can't reach the store right now. Check your connection and try again — anything you've already browsed is still saved.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
