<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radha — Delivery Partner Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="store.css">
  <style>
    body { background: #fdfdfc; padding: 20px; font-family: 'Inter', sans-serif; }
    h1 { font-family: 'Cinzel', serif; color: var(--ink); text-align: center; margin-bottom: 30px; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .card h3 { margin: 0 0 10px 0; font-size: 16px; color: var(--ink); }
    .card p { margin: 5px 0; font-size: 14px; color: #555; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .status-Dispatched { background: #e3f2fd; color: #1565c0; }
    .status-Out-for-Delivery { background: #fff3e0; color: #e65100; }
    .btn-update { background: var(--ink); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 13px; }
    .btn-update:hover { background: #000; }
    nav { text-align: right; margin-bottom: 20px; }
    nav a { color: var(--ink); text-decoration: underline; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

  <nav>
    <a onclick="logout()">Log out</a>
  </nav>

  <h1>Delivery Partner Portal</h1>
  
  <div id="deliveriesContainer">
    <p style="text-align:center; color:#888;">Loading deliveries...</p>
  </div>

  <div id="toast"></div>

  <script src="api.js"></script>
  <script src="delivery.js"></script>
</body>
</html>
