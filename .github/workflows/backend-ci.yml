name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'Rajeshwari-Backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Rajeshwari-Backend/**'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rajeshwari-Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Rajeshwari-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      # No-ops cleanly (via --if-present) until a lint script exists.
      - name: Lint (if configured)
        run: npm run lint --if-present

      # Unit tests only — none of these touch a database.
      - name: Unit tests
        run: npm test

  # Tests that write to the database run ONLY against this throwaway
  # Postgres container — never against Neon. scripts/testDbSafety.js
  # aborts them if DATABASE_URL is not a local host.
  db-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rajeshwari-Backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radha
          POSTGRES_PASSWORD: radha_ci
          POSTGRES_DB: radha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://radha:radha_ci@localhost:5432/radha_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Rajeshwari-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The historical migrations can't be replayed on an empty database
      # (tables were renamed outside of them), so build the schema
      # straight from schema.prisma for this disposable DB.
      - name: Create schema
        run: npx prisma db push

      - name: Database tests
        run: npm run test:db
