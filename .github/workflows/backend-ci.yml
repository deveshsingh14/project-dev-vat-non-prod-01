name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'Rajeshwari-Backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Rajeshwari-Backend/**'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rajeshwari-Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Rajeshwari-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      # No-ops cleanly (via --if-present) until lint/test scripts exist
      # in package.json, so this workflow keeps working as those get
      # added later instead of needing to be rewritten.
      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Test (if configured)
        run: npm test --if-present
